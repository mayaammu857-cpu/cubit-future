services:
  - type: web
    name: cubit-future-backend
    env: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: GOOGLE_DRIVE_FOLDER_ID
        value: 1j9mdfTPvHG_OhAFsMLVWUoD6qH3PkXR1
      - key: GOOGLE_MASTER_SPREADSHEET_ID
        value: 1iqRsoh_H6_5NOW5-gjsvr0NiNV7mRDK_aVXcXtdRG3U

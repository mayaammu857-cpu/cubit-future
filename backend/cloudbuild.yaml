# ==============================================================================
# Google Cloud Build Pipeline — Cubit Future Backend
# GCP Project ID: massive-acrobat-511306-j3
# ==============================================================================

steps:
  # 1. Build Docker image with Google Cloud Build
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:latest'
      - '.'

  # 2. Push image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:latest'

  # 3. Deploy container image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '$_SERVICE_NAME'
      - '--image'
      - 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:latest'
      - '--region'
      - '$_REGION'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '5'
      - '--set-env-vars'
      - 'GOOGLE_DRIVE_FOLDER_ID=1j9mdfTPvHG_OhAFsMLVWUoD6qH3PkXR1,GOOGLE_MASTER_SPREADSHEET_ID=1iqRsoh_H6_5NOW5-gjsvr0NiNV7mRDK_aVXcXtdRG3U'

substitutions:
  _SERVICE_NAME: 'cubit-future-backend'
  _REGION: 'asia-south1'

images:
  - 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:latest'
  - 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
